---
layout: default
---

<script>
    MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        svg: {
            fontCache: 'global'
        }
    };
</script>

<script
    id="MathJax-script"
    async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
</script>

<article>
    <h1>{{ page.title }}</h1>

    <p class="date">
        {{ page.date | date: "%B %d, %Y" }}
    </p>

    {{ content }}

    <hr>
    <a href="/blog/">← Back to blog</a>
</article>
